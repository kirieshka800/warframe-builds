services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: warframe
      POSTGRES_USER: warframe
      POSTGRES_PASSWORD: ${DB_PASSWORD:-warframe_local_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U warframe -d warframe]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    ports:
      - '127.0.0.1:5026:8080'
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=warframe;Username=warframe;Password=${DB_PASSWORD:-warframe_local_dev}
      Authentication__AllowLocalProfiles: 'true'
    volumes:
      - app-keys:/app/App_Data
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
  app-keys:
