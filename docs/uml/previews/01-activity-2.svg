<text x="52" y="60" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#0f172a">ЛР14 · Деятельности: автоматический подбор билда</text>
<text x="52" y="99" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#475569">Warframe-builds · AutoBuildController · алгоритм по приоритетам каталога, без LLM и без учёта инвентаря</text>
<circle cx="293.0" cy="218.0" r="13.0" fill="#172033"/>
<rect x="100" y="270" width="390" height="90" rx="14" fill="#eef4ff" stroke="#607ba8" stroke-width="1.6"/>
<text x="295.0" y="309.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">Выбрать снаряжение, цель, реактор</text>
<text x="295.0" y="330.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">и бюджет поляризаций (0–8)</text>
<rect x="630" y="270" width="370" height="90" rx="14" fill="#eef4ff" stroke="#607ba8" stroke-width="1.6"/>
<text x="815.0" y="319.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">Проверить ввод и наличие снаряжения</text>
<polygon points="820.0,410 925,460.0 820.0,510 715,460.0" fill="#fff5d9" stroke="#a77915" stroke-width="1.6"/>
<text x="820.0" y="454.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#172033">Данные</text>
<text x="820.0" y="474.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#172033">корректны?</text>
<rect x="110" y="425" width="370" height="70" rx="14" fill="#eef4ff" stroke="#607ba8" stroke-width="1.6"/>
<text x="295.0" y="464.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">Исправить параметры</text>
<rect x="630" y="560" width="370" height="90" rx="14" fill="#eef4ff" stroke="#607ba8" stroke-width="1.6"/>
<text x="815.0" y="599.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">Подобрать совместимые моды и ранги;</text>
<text x="815.0" y="620.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">рассчитать вместимость и пояснения</text>
<rect x="620" y="690" width="390" height="90" rx="14" fill="#eef4ff" stroke="#607ba8" stroke-width="1.6"/>
<text x="815.0" y="729.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">Создать предложение в MemoryCache:</text>
<text x="815.0" y="750.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">токен, владелец, fingerprint; TTL = 15 мин</text>
<rect x="110" y="820" width="370" height="80" rx="14" fill="#eef4ff" stroke="#607ba8" stroke-width="1.6"/>
<text x="295.0" y="864.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">Изучить предпросмотр и пояснения</text>
<polygon points="820.0,810 930,865.0 820.0,920 710,865.0" fill="#fff5d9" stroke="#a77915" stroke-width="1.6"/>
<text x="820.0" y="859.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#172033">Есть установленные</text>
<text x="820.0" y="879.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#172033">моды?</text>
<rect x="110" y="990" width="370" height="80" rx="14" fill="#eef4ff" stroke="#607ba8" stroke-width="1.6"/>
<text x="295.0" y="1024.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">Изменить параметры</text>
<text x="295.0" y="1045.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">или обновить каталог</text>
<polygon points="295.0,1130 420,1185.0 295.0,1240 170,1185.0" fill="#fff5d9" stroke="#a77915" stroke-width="1.6"/>
<text x="295.0" y="1179.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#172033">Подтвердить</text>
<text x="295.0" y="1199.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#172033">предложение?</text>
<rect x="110" y="1290" width="370" height="70" rx="14" fill="#eef4ff" stroke="#607ba8" stroke-width="1.6"/>
<text x="295.0" y="1329.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">Отменить предложение</text>
<rect x="630" y="1400" width="370" height="130" rx="14" fill="#eef4ff" stroke="#607ba8" stroke-width="1.6"/>
<text x="815.0" y="1438.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">Проверить токен, владельца и</text>
<text x="815.0" y="1459.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">SavedBuildId;</text>
<text x="815.0" y="1480.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">если ещё не сохранено: Cancelled = true;</text>
<text x="815.0" y="1501.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">иначе открыть сохранённый Build</text>
<rect x="620" y="1070" width="390" height="100" rx="14" fill="#eef4ff" stroke="#607ba8" stroke-width="1.6"/>
<text x="815.0" y="1114.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">Проверить токен, OwnerId, TTL;</text>
<text x="815.0" y="1135.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">захватить Gate; проверить SavedBuildId</text>
<polygon points="820.0,1210 930,1265.0 820.0,1320 710,1265.0" fill="#fff5d9" stroke="#a77915" stroke-width="1.6"/>
<text x="820.0" y="1259.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#172033">Доступно и ещё</text>
<text x="820.0" y="1279.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#172033">не сохранено?</text>
<rect x="620" y="1550" width="390" height="100" rx="14" fill="#eef4ff" stroke="#607ba8" stroke-width="1.6"/>
<text x="815.0" y="1594.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">Вернуть ошибку / 404 / форму подбора;</text>
<text x="815.0" y="1615.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">для сохранённого — открыть его Build</text>
<rect x="620" y="1710" width="390" height="100" rx="14" fill="#eef4ff" stroke="#607ba8" stroke-width="1.6"/>
<text x="815.0" y="1754.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">Начать транзакцию, блокировать каталог;</text>
<text x="815.0" y="1775.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">проверить fingerprint, моды и вместимость</text>
<polygon points="820.0,1860 930,1910.0 820.0,1960 710,1910.0" fill="#fff5d9" stroke="#a77915" stroke-width="1.6"/>
<text x="820.0" y="1904.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#172033">Проверки</text>
<text x="820.0" y="1924.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#172033">пройдены?</text>
<rect x="110" y="1870" width="370" height="80" rx="14" fill="#eef4ff" stroke="#607ba8" stroke-width="1.6"/>
<text x="295.0" y="1904.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">Показать «Подберите заново»;</text>
<text x="295.0" y="1925.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">ничего не сохранять</text>
<rect x="620" y="2020" width="390" height="100" rx="14" fill="#eef4ff" stroke="#607ba8" stroke-width="1.6"/>
<text x="815.0" y="2064.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">Сохранить Build и BuildMod в транзакции;</text>
<text x="815.0" y="2085.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">записать SavedBuildId; открыть билд</text>
<circle cx="294.0" cy="2194.0" r="14.0" fill="white" stroke="#172033" stroke-width="2"/><circle cx="294.0" cy="2194.0" r="9.0" fill="#172033"/>
<rect x="50" y="2260" width="1060" height="90" rx="3" fill="#fffbe8" stroke="#bca45d" stroke-width="1.6"/>
<text x="62" y="2286" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#172033">Гость сначала проходит вход. Повторное подтверждение возвращает тот же билд.</text>
<text x="62" y="2306" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#172033">Обычные ошибки валидации и пользовательские отказы показаны явно; инфраструктурные исключения не развёрнуты.</text>
