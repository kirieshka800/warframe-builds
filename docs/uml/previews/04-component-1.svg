<ns0:rect x="60" y="1400" width="1640" height="95" rx="3" fill="#fffbe8" stroke="#bca45d" stroke-width="1.6" />
<ns0:text x="72" y="1426" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#172033">Пунктирная стрелка направлена от потребителя к используемому компоненту. Сплошная линия с окружностью — предоставляемый интерфейс.</ns0:text>
<ns0:text x="72" y="1446" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#172033">Контроллеры также используют модели и WarframeApiService (HomeController.SyncData); Program регистрирует DbContext/HttpClient и запускает миграции/сидер.</ns0:text>
<ns0:text x="72" y="1466" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#172033">Чтобы не пересекать все линии, эти зависимости перечислены здесь. Все группы C# компилируются в одно веб-приложение WarframeBuilds.dll.</ns0:text>
