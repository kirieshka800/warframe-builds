<text x="1205.0" y="168.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#172033">Confirm [каталог изменился или нет модов] /</text>
<text x="1205.0" y="186.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#172033">отказать в сохранении; состояние не менять</text>
<rect x="65" y="590" width="500" height="65" rx="3" fill="white" fill-opacity="0.96"/>
<text x="315.0" y="616.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#172033">GET, Confirm или Cancel [владелец; запись доступна] /</text>
<text x="315.0" y="634.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#172033">открыть Details(SavedBuildId); не создавать копию</text>
<rect x="925" y="590" width="500" height="65" rx="3" fill="white" fill-opacity="0.96"/>
<text x="1175.0" y="616.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#172033">GET или Confirm [владелец] / «предложение отменено»;</text>
<text x="1175.0" y="634.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#172033">Cancel [владелец] / повторить отмену</text>
<rect x="595" y="940" width="310" height="70" rx="3" fill="white" fill-opacity="0.96"/>
