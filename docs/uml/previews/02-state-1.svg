<text x="52" y="60" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#0f172a">ЛР15 · Состояния предложения автоподбора</text>
<text x="52" y="99" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#475569">Объект: AutoBuildProposalStore.Proposal · состояние определяется Cancelled, SavedBuildId и доступностью в MemoryCache</text>
<circle cx="749.0" cy="164.0" r="14.0" fill="#172033"/>
<rect x="500" y="265" width="500" height="190" rx="14" fill="#eef4ff" stroke="#607ba8" stroke-width="1.6"/>
<text x="750.0" y="322.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">Ожидает подтверждения</text>
<text x="750.0" y="343.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033"></text>
<text x="750.0" y="364.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">Cancelled = false</text>
<text x="750.0" y="385.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">SavedBuildId = null</text>
<text x="750.0" y="406.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">entry / сохранить OwnerId, Plan, Fingerprint, ExpiresAt</text>
<rect x="80" y="700" width="500" height="190" rx="14" fill="#eef4ff" stroke="#607ba8" stroke-width="1.6"/>
<text x="330.0" y="757.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">Сохранено</text>
<text x="330.0" y="778.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033"></text>
<text x="330.0" y="799.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">SavedBuildId = id</text>
<text x="330.0" y="820.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">entry / Build уже записан в PostgreSQL</text>
<text x="330.0" y="841.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">Билд существует независимо от кэша</text>
