<text x="1170.0" y="799.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">Cancelled = true</text>
<text x="1170.0" y="820.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">SavedBuildId = null</text>
<text x="1170.0" y="841.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">entry / показать сообщение об отмене</text>
<circle cx="750.0" cy="1175.0" r="15.0" fill="white" stroke="#172033" stroke-width="2"/><circle cx="750.0" cy="1175.0" r="10.0" fill="#172033"/>
<rect x="60" y="1240" width="1380" height="110" rx="3" fill="#fffbe8" stroke="#bca45d" stroke-width="1.6"/>
<text x="72" y="1267" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">Это аналитические состояния, а не enum в коде. Конечная точка завершает жизнь предложения, не удаляет Build.</text>
<text x="72" y="1288" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">Запрос чужого владельца получает 404 без изменения состояния. Неизвестный или истёкший токен ведёт на форму подбора.</text>
<text x="72" y="1309" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172033">При изменении каталога Confirm не устанавливает Cancelled и не удаляет предложение: нужен новый подбор.</text>
<rect x="510" y="195" width="470" height="44" rx="3" fill="white" fill-opacity="0.96"/>
<text x="745.0" y="220.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#172033">Add(owner, plan, fingerprint) / создать запись</text>
<rect x="90" y="480" width="480" height="105" rx="3" fill="white" fill-opacity="0.96"/>
<text x="330.0" y="517.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#172033">Confirm [владелец; TTL не истёк; есть моды;</text>
<text x="330.0" y="535.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#172033">каталог и вместимость проверены] /</text>
<text x="330.0" y="553.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#172033">commit Build; SavedBuildId = id</text>
<rect x="935" y="500" width="480" height="65" rx="3" fill="white" fill-opacity="0.96"/>
<text x="1175.0" y="526.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#172033">Cancel [владелец; SavedBuildId = null] /</text>
<text x="1175.0" y="544.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" fill="#172033">Cancelled = true</text>
